name: Feature request
description: Suggest something Glancet should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, rather than the solution you have in mind — it often has a better answer at notch size.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
